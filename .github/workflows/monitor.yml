name: flat-monitor

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: flat-monitor
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install requests==2.32.3

      - name: Перевірити сайти
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
        run: python monitor.py

      - name: Зберегти переглянуті оголошення
        run: |
          git config user.name "flat-monitor"
          git config user.email "flat-monitor@users.noreply.github.com"
          git add seen.json
          if ! git diff --cached --quiet; then
            git commit -m "seen: $(date -u +%Y-%m-%dT%H:%M)"
            git pull --rebase -X theirs || true
            git push
          fi
