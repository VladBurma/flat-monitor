name: flat-monitor

# Один запуск працює ~5.5 год і перевіряє сайти кожні 15 хв,
# а наприкінці сам запускає наступний. Розклад cron — запасний
# варіант, якщо ланцюжок колись обірветься.
on:
  schedule:
    - cron: "7 */3 * * *"
  workflow_dispatch: {}

permissions:
  contents: write
  actions: write

concurrency:
  group: flat-monitor
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install requests==2.32.3

      - name: Перевіряти сайти кожні 15 хв
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
        run: |
          git config user.name "flat-monitor"
          git config user.email "flat-monitor@users.noreply.github.com"
          end=$(( $(date +%s) + 330*60 ))
          while :; do
            echo "=== $(TZ=Europe/Kyiv date '+%d.%m %H:%M') ==="
            python monitor.py || echo "monitor.py завершився з помилкою"
            git add seen.json
            if ! git diff --cached --quiet; then
              git commit -q -m "seen: $(date -u +%Y-%m-%dT%H:%M)"
              git pull -q --rebase -X theirs || true
              git push -q || echo "push не вдався"
            fi
            [ $(( $(date +%s) + 15*60 )) -lt $end ] || break
            sleep 900
          done

      - name: Запустити наступний цикл
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run monitor.yml --ref main -R "$GITHUB_REPOSITORY"
